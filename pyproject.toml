[project]
name = "dayrhythm"
version = "0.1.0"
description = "Explainable daily-routine baselines from timestamped home events (motion, door contacts). No ML, no audio, no video."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yashvardhan Thanvi", email = "yashvt9404@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ageing-in-place", "care", "routine", "anomaly-detection", "smart-home", "explainable"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
